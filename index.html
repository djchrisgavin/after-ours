<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>AFTER OURS — Plateau coordonné</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #B3502C;
    --ink: #2A1F14;
    --paper: #F2E9D8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1410;
    color: var(--paper);
    font-family: 'Space Mono', monospace;
    padding: 20px;
  }
  .wrap { max-width: 1300px; margin: 0 auto; }
  .map-container {
    position: relative;
    width: 100%;
    border: 2px solid var(--accent);
  }
  .map-container img { display: block; width: 100%; height: auto; }

  .node {
    position: absolute;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: rgba(179,80,44,0.0);
    border: 2px solid transparent;
    transform: translate(-50%, -50%);
    cursor: pointer;
  }
  .node.debug { border-color: rgba(0,255,180,0.8); background: rgba(0,255,180,0.15); }

  .token {
    position: absolute;
    width: 26px; height: 26px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 12px; color: white;
    border: 2px solid white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    transition: left 0.8s cubic-bezier(0.4,0,0.2,1), top 0.8s cubic-bezier(0.4,0,0.2,1);
    z-index: 5;
  }

  .panel {
    margin-top: 16px;
    padding: 16px 18px;
    background: #2a221a;
    border: 1px solid var(--accent);
  }
  .panel h2 { font-size: 14px; margin-bottom: 10px; color: var(--accent); }
  .tab-row, .move-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .tab-row button, .move-row button {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 8px 12px;
    background: var(--paper);
    border: 1px solid var(--accent);
    color: var(--ink);
    cursor: pointer;
  }
  .tab-row button.active { background: var(--accent); color: white; }
  .move-row button:hover { background: var(--accent); color: white; }
  .note { font-size: 11px; color: #c9b89a; margin-top: 8px; line-height: 1.5; }
  .toggle-debug {
    font-size: 11px; color: var(--paper); background: none; border: 1px solid var(--paper);
    padding: 6px 12px; cursor: pointer; margin-bottom: 12px;
  }
</style>
</head>
<body>
<div class="wrap">
  <button class="toggle-debug" onclick="toggleDebug()">Afficher/masquer les points de calage (debug)</button>
  <div class="map-container">
    <img src="plan-final.png" alt="Plateau AFTER OURS">
    <div id="nodesLayer"></div>
    <div id="tokensLayer"></div>
  </div>

  <div class="panel">
    <h2>Faire avancer un joueur</h2>
    <div class="tab-row" id="tabRow"></div>
    <div class="move-row" id="moveRow"></div>
    <div class="note">
      Positions et connexions estimées visuellement à partir du plan — à corriger ensemble une fois testé.
      Seuls les endroits accessibles depuis la position actuelle sont proposés.
    </div>
  </div>
</div>

<script>
  // Coordonnées en pourcentage (x, y) de l'image, estimées visuellement.
  const nodes = {
    n1:  { x: 7.9,  y: 34.7, label: '1 · Entrée' },
    n2:  { x: 23.5, y: 25.0, label: '2 · Sécurité' },
    n3:  { x: 53.8, y: 29.2, label: '3 · Dancefloor' },
    n4:  { x: 53.8, y: 22.4, label: '4 · Main Stage' },
    n5:  { x: 53.8, y: 17.1, label: '5 · Dj Booth' },
    n6:  { x: 53.8, y: 5.6,  label: '6 · Backstage' },
    n7:  { x: 96.0, y: 25.5, label: '7 · Parking' },
    n8:  { x: 16.3, y: 57.6, label: '8 · Podium 1' },
    n9:  { x: 35.9, y: 51.3, label: '9 · Podium 2' },
    n10: { x: 31.6, y: 70.9, label: '10 · Podium 3' },
    n11: { x: 53.8, y: 41.3, label: '11 · Bar' },
    n12: { x: 53.8, y: 61.4, label: '12 · Lac' },
    n13: { x: 74.9, y: 65.3, label: '13 · Coin Chill' },
    n14: { x: 93.0, y: 38.1, label: '14 · Médical' },
    n15: { x: 94.8, y: 47.3, label: '15 · Vêtements' },
    n16: { x: 92.0, y: 57.2, label: '16 · Piercings' },
    n17: { x: 91.4, y: 73.5, label: '17 · Toilettes' },
    n18: { x: 88.7, y: 66.2, label: '18 · Douches' },
    n19: { x: 39.2, y: 62.0, label: '19 · Xdome' },
    A:   { x: 38.0, y: 28.4, label: 'A' },
    B:   { x: 38.0, y: 35.7, label: 'B' },
    C:   { x: 45.0, y: 25.2, label: 'C' },
    D:   { x: 71.7, y: 25.2, label: 'D' },
    F:   { x: 70.7, y: 33.4, label: 'F' },
    G:   { x: 79.3, y: 22.6, label: 'G' },
    H:   { x: 78.5, y: 25.2, label: 'H' },
    I:   { x: 78.5, y: 34.7, label: 'I' },
    J:   { x: 78.5, y: 40.8, label: 'J' },
    K:   { x: 43.1, y: 42.5, label: 'K' },
    L:   { x: 23.5, y: 42.0, label: 'L' },
    M:   { x: 23.5, y: 36.0, label: 'M' },
    N:   { x: 70.7, y: 36.4, label: 'N' },
    P:   { x: 68.7, y: 43.3, label: 'P' },
    Q:   { x: 68.7, y: 46.5, label: 'Q' },
    R:   { x: 68.7, y: 52.8, label: 'R' },
    S:   { x: 85.4, y: 56.9, label: 'S' },
    V:   { x: 67.6, y: 69.6, label: 'V' },
    W:   { x: 51.9, y: 48.5, label: 'W' },
    X:   { x: 82.2, y: 73.8, label: 'X' },
    Y:   { x: 44.8, y: 68.8, label: 'Y' },
    AB:  { x: 47.1, y: 81.2, label: 'AB' },
    AD:  { x: 27.2, y: 48.6, label: 'AD' },
    AE:  { x: 26.4, y: 60.7, label: 'AE' },
    AF:  { x: 25.1, y: 54.3, label: 'AF' },
    AN:  { x: 83.4, y: 81.2, label: 'AN' }
  };

  // Adjacence estimée visuellement (best-effort, à corriger ensemble)
  const adjacency = {
    n1: ['n2'],
    n2: ['n1', 'A', 'M'],
    A: ['n2', 'C', 'B'],
    B: ['A', 'K'],
    C: ['A', 'n3'],
    n3: ['C', 'n4', 'n11'],
    n4: ['n3', 'n5', 'D'],
    n5: ['n4', 'n6', 'n13'],
    n6: ['n5', 'n7', 'n14', 'n17'],
    D: ['n4', 'F'],
    F: ['D', 'N', 'G'],
    G: ['F', 'H'],
    H: ['G', 'I', 'n7'],
    I: ['H', 'J'],
    J: ['I', 'N'],
    N: ['F', 'J', 'P'],
    P: ['N', 'Q'],
    Q: ['P', 'R'],
    R: ['Q', 'S', 'V'],
    S: ['R', 'n16', 'n15'],
    n7: ['H', 'n6'],
    n14: ['n6', 'n15'],
    n15: ['n14', 'S'],
    n16: ['S', 'n18'],
    n18: ['n16', 'n17'],
    n17: ['n18', 'n6'],
    n13: ['n5', 'V'],
    V: ['R', 'n13', 'n12'],
    n12: ['V', 'Y', 'W'],
    W: ['K', 'n12', 'n11'],
    n11: ['n3', 'W'],
    K: ['B', 'W', 'L'],
    L: ['K', 'M', 'AD'],
    M: ['n2', 'L'],
    AD: ['L', 'AF'],
    AF: ['AD', 'AE', 'n8'],
    AE: ['AF', 'n19', 'n8'],
    n8: ['AF', 'AE'],
    n19: ['AE', 'Y'],
    Y: ['n12', 'n19', 'n10', 'AB'],
    n10: ['Y'],
    AB: ['Y', 'AN'],
    AN: ['AB', 'X'],
    X: ['AN', 'V']
  };

  const tokenColors = { sam: '#B3502C', lina: '#2A1F14', yanis: '#C99A3D' };
  const positions = { sam: 'n1', lina: 'n1', yanis: 'n1' };
  let activeToken = 'sam';

  function renderNodes(debug) {
    const layer = document.getElementById('nodesLayer');
    layer.innerHTML = '';
    Object.keys(nodes).forEach(key => {
      const n = nodes[key];
      const div = document.createElement('div');
      div.className = 'node' + (debug ? ' debug' : '');
      div.style.left = n.x + '%';
      div.style.top = n.y + '%';
      div.title = n.label;
      layer.appendChild(div);
    });
  }

  function renderTokens() {
    const layer = document.getElementById('tokensLayer');
    layer.innerHTML = '';
    const spread = { sam: -10, lina: 0, yanis: 10 };
    Object.keys(positions).forEach(name => {
      const n = nodes[positions[name]];
      const div = document.createElement('div');
      div.className = 'token';
      div.style.background = tokenColors[name];
      div.style.left = 'calc(' + n.x + '% + ' + spread[name] + 'px)';
      div.style.top = n.y + '%';
      div.textContent = name.charAt(0).toUpperCase();
      layer.appendChild(div);
    });
  }

  function renderTabs() {
    const row = document.getElementById('tabRow');
    row.innerHTML = '';
    Object.keys(positions).forEach(name => {
      const b = document.createElement('button');
      b.textContent = name.charAt(0).toUpperCase() + name.slice(1) + ' (' + nodes[positions[name]].label + ')';
      if (name === activeToken) b.classList.add('active');
      b.onclick = () => { activeToken = name; renderTabs(); renderMoves(); };
      row.appendChild(b);
    });
  }

  function renderMoves() {
    const row = document.getElementById('moveRow');
    row.innerHTML = '';
    const options = adjacency[positions[activeToken]] || [];
    options.forEach(dest => {
      const b = document.createElement('button');
      b.textContent = '→ ' + nodes[dest].label;
      b.onclick = () => {
        positions[activeToken] = dest;
        renderTokens();
        renderTabs();
        renderMoves();
      };
      row.appendChild(b);
    });
  }

  let debugOn = false;
  function toggleDebug() {
    debugOn = !debugOn;
    renderNodes(debugOn);
  }

  renderNodes(false);
  renderTokens();
  renderTabs();
  renderMoves();
</script>

</body>
</html>
