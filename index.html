<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>AFTER OURS — Plateau coordonné</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #B3502C;
    --ink: #2A1F14;
    --paper: #F2E9D8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1410;
    color: var(--paper);
    font-family: 'Space Mono', monospace;
    padding: 20px;
  }
  .wrap { max-width: 1300px; margin: 0 auto; }
  .map-container {
    position: relative;
    width: 100%;
    border: 2px solid var(--accent);
  }
  .map-container img { display: block; width: 100%; height: auto; }

  .node {
    position: absolute;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: rgba(179,80,44,0.0);
    border: 2px solid transparent;
    transform: translate(-50%, -50%);
    cursor: pointer;
  }
  .node.debug { border-color: rgba(0,255,180,0.8); background: rgba(0,255,180,0.15); }

  .token {
    position: absolute;
    width: 26px; height: 26px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 12px; color: white;
    border: 2px solid white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    transition: left 0.8s cubic-bezier(0.4,0,0.2,1), top 0.8s cubic-bezier(0.4,0,0.2,1);
    z-index: 5;
  }

  .panel {
    margin-top: 16px;
    padding: 16px 18px;
    background: #2a221a;
    border: 1px solid var(--accent);
  }
  .panel h2 { font-size: 14px; margin-bottom: 10px; color: var(--accent); }
  .tab-row, .move-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .tab-row button, .move-row button {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 8px 12px;
    background: var(--paper);
    border: 1px solid var(--accent);
    color: var(--ink);
    cursor: pointer;
  }
  .tab-row button.active { background: var(--accent); color: white; }
  .move-row button:hover { background: var(--accent); color: white; }
  .note { font-size: 11px; color: #c9b89a; margin-top: 8px; line-height: 1.5; }
  .toggle-debug {
    font-size: 11px; color: var(--paper); background: none; border: 1px solid var(--paper);
    padding: 6px 12px; cursor: pointer; margin-bottom: 12px;
  }
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(10,8,5,0.75);
    align-items: center; justify-content: center;
    z-index: 50;
  }
  .modal-overlay.active { display: flex; }
  .modal-box {
    background: var(--paper);
    color: var(--ink);
    max-width: 380px;
    width: 90%;
    padding: 24px;
    border: 2px solid var(--accent);
  }
  .modal-box .modal-eyebrow { font-size: 11px; color: var(--accent); letter-spacing: 0.08em; margin-bottom: 6px; text-transform: uppercase; }
  .modal-box h3 { font-size: 20px; margin-bottom: 10px; }
  .modal-box .modal-defi { font-size: 12.5px; line-height: 1.5; margin-bottom: 16px; color: var(--ink-soft); }
  .choice-list { display: flex; flex-direction: column; gap: 8px; }
  .choice-btn {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    line-height: 1.4;
    text-align: left;
    padding: 12px 14px;
    background: var(--paper);
    border: 1.5px solid var(--accent);
    color: var(--ink);
    cursor: pointer;
  }
  .choice-btn:hover { background: var(--accent); color: white; }
  .choice-confirmed {
    font-size: 13px;
    padding: 12px 14px;
    background: rgba(179,80,44,0.12);
    border: 1.5px solid var(--accent);
    margin-bottom: 10px;
  }
  .choice-close-btn {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    padding: 10px 18px;
    background: var(--accent);
    color: white;
    border: none;
    cursor: pointer;
    margin-top: 4px;
  }
</style>
</head>
<body>
<div class="wrap">
  <button class="toggle-debug" onclick="toggleDebug()">Afficher/masquer les points de calage (debug)</button>
  <div class="map-container">
    <img src="plan-final.png" alt="Plateau AFTER OURS">
    <div id="nodesLayer"></div>
    <div id="tokensLayer"></div>
  </div>

  <div class="panel">
    <h2>Faire avancer un joueur</h2>
    <div class="tab-row" id="tabRow"></div>
    <div class="move-row" id="moveRow"></div>
    <div class="note">
      Positions et connexions estimées visuellement à partir du plan — à corriger ensemble une fois testé.
      Seuls les endroits accessibles depuis la position actuelle sont proposés.
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-eyebrow" id="modalEyebrow">Défi</div>
    <h3 id="modalTitle"></h3>
    <div class="modal-defi" id="modalIntro"></div>
    <div id="modalChoices" class="choice-list"></div>
  </div>
</div>

<script>
  // Coordonnées en pourcentage (x, y), mesurées précisément sur l'image (1448x1086px)
  const nodes = {
    n1:  { x: 7.5,  y: 36.0, label: '1 · Entrée' },
    n2:  { x: 22.8, y: 28.1, label: '2 · Sécurité' },
    n3:  { x: 50.6, y: 29.5, label: '3 · Dancefloor' },
    n4:  { x: 53.9, y: 22.4, label: '4 · Main Stage' },
    n5:  { x: 53.9, y: 18.0, label: '5 · Dj Booth' },
    n6:  { x: 53.9, y: 6.3,  label: '6 · Backstage' },
    n7:  { x: 94.5, y: 25.6, label: '7 · Parking' },
    n8:  { x: 16.0, y: 59.1, label: '8 · Podium 1' },
    n9:  { x: 35.6, y: 52.6, label: '9 · Podium 2' },
    n10: { x: 30.7, y: 70.0, label: '10 · Podium 3' },
    n11: { x: 52.6, y: 41.2, label: '11 · Bar' },
    n12: { x: 54.6, y: 61.0, label: '12 · Lac' },
    n13: { x: 74.4, y: 65.5, label: '13 · Coin Chill' },
    n14: { x: 93.2, y: 37.9, label: '14 · Médical' },
    n15: { x: 94.1, y: 47.6, label: '15 · Vêtements' },
    n16: { x: 95.3, y: 58.9, label: '16 · Piercings' },
    n17: { x: 89.7, y: 73.6, label: '17 · Toilettes' },
    n18: { x: 88.3, y: 66.2, label: '18 · Douches' },
    n19: { x: 38.7, y: 62.2, label: '19 · Xdome' },
    A:   { x: 36.1, y: 27.5, label: 'A' },
    B:   { x: 31.9, y: 33.3, label: 'B' },
    C:   { x: 42.5, y: 25.6, label: 'C' },
    D:   { x: 63.7, y: 25.2, label: 'D' },
    F:   { x: 70.4, y: 28.1, label: 'F' },
    G1:  { x: 73.3, y: 18.9, label: 'G (parking)' },
    G2:  { x: 66.5, y: 61.0, label: 'G (coin chill)' },
    H:   { x: 78.5, y: 24.9, label: 'H' },
    I:   { x: 80.1, y: 31.0, label: 'I' },
    J:   { x: 78.2, y: 39.8, label: 'J' },
    K:   { x: 40.1, y: 47.6, label: 'K' },
    L:   { x: 38.0, y: 39.6, label: 'L' },
    M:   { x: 22.4, y: 35.6, label: 'M' },
    N:   { x: 70.4, y: 35.5, label: 'N' },
    P:   { x: 70.4, y: 41.0, label: 'P' },
    Q:   { x: 70.4, y: 46.7, label: 'Q' },
    R:   { x: 70.4, y: 54.5, label: 'R' },
    S:   { x: 85.1, y: 56.8, label: 'S' },
    V1:  { x: 47.3, y: 63.7, label: 'V (xdome)' },
    V2:  { x: 68.9, y: 65.9, label: 'V (coin chill)' },
    W1:  { x: 43.9, y: 53.6, label: 'W (podium 2)' },
    W2:  { x: 68.0, y: 72.1, label: 'W (toilettes)' },
    X:   { x: 73.8, y: 80.0, label: 'X' },
    Y:   { x: 44.2, y: 69.9, label: 'Y' },
    AB:  { x: 47.1, y: 77.7, label: 'AB' },
    AD:  { x: 27.6, y: 49.0, label: 'AD' },
    AE:  { x: 27.6, y: 60.8, label: 'AE' },
    AF:  { x: 22.8, y: 55.0, label: 'AF' },
    AN:  { x: 82.0, y: 84.6, label: 'AN' }
  };

  // Adjacence reconstruite à partir des mesures précises (chemins visibles + raccourcis officiels)
  const adjacency = {
    n1: ['n2'],
    n2: ['n1', 'A', 'M', 'n9', 'n10'],
    A: ['n2', 'C'],
    C: ['A', 'n3'],
    n3: ['C', 'n4', 'n11'],
    n4: ['n3', 'n5', 'D'],
    n5: ['n4', 'n6', 'n13'],
    n6: ['n5', 'n7', 'n14', 'n17'],
    D: ['n4', 'F'],
    F: ['D', 'N', 'G1'],
    G1: ['F', 'H'],
    H: ['G1', 'I', 'n7'],
    I: ['H', 'J'],
    J: ['I', 'N', 'n14'],
    N: ['F', 'J', 'P'],
    P: ['N', 'Q'],
    Q: ['P', 'R'],
    R: ['Q', 'S', 'G2'],
    S: ['R', 'n15', 'n16'],
    n7: ['H', 'n6', 'n14'],
    n14: ['n7', 'n6', 'J', 'n15'],
    n15: ['n14', 'S'],
    n16: ['S'],
    n13: ['n5', 'V2', 'n18'],
    V2: ['n13', 'G2', 'W2'],
    G2: ['R', 'V2'],
    W2: ['V2', 'X', 'AN'],
    X: ['W2', 'AN', 'n17'],
    AN: ['W2', 'X'],
    n18: ['n13', 'n17'],
    n17: ['n18', 'n6', 'X'],
    n12: ['V1', 'Y'],
    V1: ['n12', 'W1'],
    W1: ['V1', 'K'],
    K: ['W1', 'L', 'B', 'n9', 'n11'],
    B: ['K'],
    L: ['K', 'M'],
    M: ['n2', 'L', 'AD'],
    AD: ['M', 'AF'],
    AF: ['AD', 'AE'],
    AE: ['AF', 'n19', 'n8'],
    n8: ['AE'],
    n19: ['AE', 'AB'],
    Y: ['n12', 'n10', 'AB'],
    n10: ['Y', 'n2'],
    AB: ['Y', 'n19'],
    n9: ['K', 'n2'],
    n11: ['n3', 'K']
  };

  const tokenColors = { sam: '#B3502C', lina: '#2A1F14', yanis: '#C99A3D' };
  const positions = { sam: 'n1', lina: 'n1', yanis: 'n1' };
  let activeToken = 'sam';

  function renderNodes(debug) {
    const layer = document.getElementById('nodesLayer');
    layer.innerHTML = '';
    Object.keys(nodes).forEach(key => {
      const n = nodes[key];
      const div = document.createElement('div');
      div.className = 'node' + (debug ? ' debug' : '');
      div.style.left = n.x + '%';
      div.style.top = n.y + '%';
      div.title = n.label;
      layer.appendChild(div);
    });
  }

  function renderTokens() {
    const layer = document.getElementById('tokensLayer');
    layer.innerHTML = '';
    const spread = { sam: -10, lina: 0, yanis: 10 };
    Object.keys(positions).forEach(name => {
      const n = nodes[positions[name]];
      const div = document.createElement('div');
      div.className = 'token';
      div.style.background = tokenColors[name];
      div.style.left = 'calc(' + n.x + '% + ' + spread[name] + 'px)';
      div.style.top = n.y + '%';
      div.textContent = name.charAt(0).toUpperCase();
      layer.appendChild(div);
    });
  }

  function renderTabs() {
    const row = document.getElementById('tabRow');
    row.innerHTML = '';
    Object.keys(positions).forEach(name => {
      const b = document.createElement('button');
      b.textContent = name.charAt(0).toUpperCase() + name.slice(1) + ' (' + nodes[positions[name]].label + ')';
      if (name === activeToken) b.classList.add('active');
      b.onclick = () => { activeToken = name; renderTabs(); renderMoves(); };
      row.appendChild(b);
    });
  }

  // Thèmes de défis par lieu (personnalité ludique) — piochés dans les banques mini-jeux/connaissances
  const themePools = {
    rythme: [
      "Mini-jeu : Rhythm Machine — ajoute un son/geste à une boucle collective, tiens 20 s.",
      "Mini-jeu : Le rythme jumeau — reproduis une séquence de frappes qui s'allonge.",
      "Mini-jeu : Mime turbo — fais deviner 5 mots uniquement en mimant, 4/5 en 60 s.",
      "Mini-jeu : Miroir — improvise des mouvements, l'autre les reproduit 30 s sans rupture."
    ],
    performance: [
      "Mini-jeu : Catégorie infernale — cite un élément d'une catégorie, 3 s max, aucun doublon.",
      "Mini-jeu : Histoire en un mot — construisez une phrase cohérente, un mot chacun.",
      "Mini-jeu : Alphabet express — artiste + ville + objet + aliment sur une lettre, 4 réponses en 20 s.",
      "DJ résident : fais écouter un morceau en tête-à-tête à quelqu'un."
    ],
    musique: [
      "Écoute un extrait sonore : devine si le tempo est lent, moyen ou rapide.",
      "Mini-jeu : Le beat parfait — tape un tempo de mémoire à ±5 BPM.",
      "Mini-jeu : La mélodie interdite — fredonne une chanson sans les paroles, à faire deviner."
    ],
    secret: [
      "Mini-jeu : Télépathie — réponds à une question en même temps qu'un autre joueur, sans se concerter.",
      "Mini-jeu : Code secret — devine une séquence de 4 couleurs en 6 essais maximum.",
      "Mini-jeu : Communication muette — classez 8 cartes dans l'ordre demandé, sans parler.",
      "Mini-jeu : Huit questions — devine en posant uniquement des questions oui/non.",
      "Mini-jeu : Chef secret — un meneur dirige discrètement le groupe, un enquêteur doit le trouver."
    ],
    logique: [
      "Mini-jeu : Mémoire Playa — observe 12 objets 15 s, retrouves-en 8 de mémoire.",
      "Mini-jeu : Séquence mémoire — reproduis une séquence de 7 symboles ou couleurs.",
      "Mini-jeu : Code secret — devine une séquence de 4 couleurs en 6 essais maximum."
    ],
    adresse: [
      "Mini-jeu : Tour fragile — construis une tour de 8 éléments d'une seule main, elle doit tenir 5 s.",
      "Mini-jeu : Équilibre — transporte une balle sur une surface instable sans chute.",
      "Mini-jeu : Architectes — construisez une tour ensemble, chacun une seule main.",
      "Mini-jeu : Le poteau — tiens en équilibre sur un pied, un témoin chronomètre."
    ],
    reflexion: [
      "Mini-jeu : L'estimation — devine la quantité, longueur ou poids d'un objet, à 15% près.",
      "Mini-jeu : La majorité — prédis la réponse majoritaire du groupe sur 2 questions sur 3.",
      "Mini-jeu : Détail du festival — retrouve où se trouve un détail zoomé du site."
    ],
    social: [
      "Mini-jeu : Un mot pour trois — fais deviner trois mots avec un seul indice commun.",
      "Mini-jeu : La file silencieuse — rangez-vous par mois de naissance, sans parler.",
      "Mini-jeu : Le territoire — duel de culture générale entre deux équipes.",
      "Sers un verre à quelqu'un, ou donne les ingrédients d'un cocktail."
    ],
    absurde: [
      "Mini-jeu : Mission absurde — fais tenir 5 objets les uns sur les autres sans les tenir.",
      "Mini-jeu : Le dessin impossible — dessine de la main non dominante, à faire deviner en 10 s.",
      "Mini-jeu : Catégorie éclair — 10 réponses différentes en 30 secondes.",
      "Mini-jeu : le compliment impossible — complimente sincèrement un objet anodin de la pièce."
    ]
  };

  // Mécaniques spéciales fixes (remplacent le tirage thématique pour ces lieux précis)
  const specialDefis = {
    n2: "Passage obligé : réussis ton contrôle, ou repars fouillé et dépouillé.",
    n6: "Défi de sortie de zone — dépend de qui garde le passage ce soir.",
    n7: "Tu y es. Selon ton argent : taxi, ou tu rentres à pied.",
    n9: "Le poteau : tiens en équilibre sur un pied, un témoin chronomètre.",
    n10: "Danse en duo avec un partenaire désigné par le jeu.",
    n12: "Une pause ici fait redescendre ton niveau de risque.",
    n13: "Une pause ici fait aussi redescendre ton niveau de risque.",
    n19: "Accès réservé... à moins que quelqu'un t'y attende."
  };

  // Thème associé à chaque lieu numéroté (personnalité ludique)
  const locationThemes = {
    n1: 'absurde',
    n3: 'rythme',
    n4: 'performance',
    n5: 'musique',
    n8: 'adresse',
    n11: 'social',
    n14: 'absurde',
    n15: 'absurde',
    n16: 'absurde',
    n17: 'absurde',
    n18: 'absurde'
  };

  const genericDefis = [
    "Connaissances : on dit un ou une track ?",
    "Connaissances : que veut dire \"b2b\" entre deux DJ ?",
    "Mini-jeu Solo : Chronomètre humain — annonce quand 30 secondes se sont écoulées, sans montre.",
    "Mini-jeu Solo : Catégorie éclair — 10 réponses différentes en 30 secondes.",
    "Mini-jeu Solo : L'estimation — devine la quantité, la longueur ou le poids d'un objet, à moins de 15% près."
  ];

  function pickFrom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  // Pioche n éléments distincts (ou moins si le pool est plus petit)
  function pickMany(arr, n) {
    const pool = [...arr];
    const picked = [];
    while (picked.length < n && pool.length > 0) {
      const i = Math.floor(Math.random() * pool.length);
      picked.push(pool.splice(i, 1)[0]);
    }
    return picked;
  }

  function showDefiModal(nodeKey) {
    const label = nodes[nodeKey].label;
    const isNamed = /^n\d+/.test(nodeKey);
    const introEl = document.getElementById('modalIntro');
    const choicesEl = document.getElementById('modalChoices');
    choicesEl.innerHTML = '';

    if (isNamed && specialDefis[nodeKey]) {
      // mécanique spéciale fixe : un seul texte, pas de choix
      document.getElementById('modalEyebrow').textContent = 'Lieu — mécanique spéciale';
      introEl.textContent = specialDefis[nodeKey];
      const b = document.createElement('button');
      b.className = 'choice-close-btn';
      b.textContent = "C'est noté →";
      b.onclick = closeModal;
      choicesEl.appendChild(b);
    } else {
      let options, eyebrow;
      if (isNamed && locationThemes[nodeKey]) {
        // case principale (lieu) : 4 défis au choix, piochés dans le thème du lieu
        options = pickMany(themePools[locationThemes[nodeKey]], 4);
        eyebrow = 'Lieu — ' + locationThemes[nodeKey] + ' — choisis ton défi';
      } else if (isNamed) {
        options = pickMany(genericDefis, 4);
        eyebrow = 'Lieu — choisis ton défi';
      } else {
        // point de passage intermédiaire : 1 ou 2 défis seulement
        const n = Math.random() < 0.5 ? 1 : 2;
        options = pickMany(genericDefis, n);
        eyebrow = options.length > 1 ? 'Point de passage — choisis ton défi' : 'Point de passage';
      }
      document.getElementById('modalEyebrow').textContent = eyebrow;
      introEl.textContent = options.length > 1 ? '' : '';
      options.forEach(opt => {
        const b = document.createElement('button');
        b.className = 'choice-btn';
        b.textContent = opt;
        b.onclick = () => confirmDefiChoice(opt);
        choicesEl.appendChild(b);
      });
    }
    document.getElementById('modalTitle').textContent = label;
    document.getElementById('modalOverlay').classList.add('active');
  }

  function confirmDefiChoice(opt) {
    const choicesEl = document.getElementById('modalChoices');
    choicesEl.innerHTML = `<div class="choice-confirmed">${opt}</div>`;
    const b = document.createElement('button');
    b.className = 'choice-close-btn';
    b.textContent = "C'est noté →";
    b.onclick = closeModal;
    choicesEl.appendChild(b);
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
  }

  function renderMoves() {
    const row = document.getElementById('moveRow');
    row.innerHTML = '';
    const options = adjacency[positions[activeToken]] || [];
    options.forEach(dest => {
      const b = document.createElement('button');
      b.textContent = '→ ' + nodes[dest].label;
      b.onclick = () => {
        positions[activeToken] = dest;
        renderTokens();
        renderTabs();
        renderMoves();
        setTimeout(() => showDefiModal(dest), 850);
      };
      row.appendChild(b);
    });
  }

  let debugOn = false;
  function toggleDebug() {
    debugOn = !debugOn;
    renderNodes(debugOn);
  }

  renderNodes(false);
  renderTokens();
  renderTabs();
  renderMoves();
</script>

</body>
</html>
