<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFTER OURS — Parcours complet</title>

<style>
  :root {
    --bg: #0A0A12;
    --surface: #16151F;
    --surface-2: #1E1D2A;
    --ink: #F2F1F7;
    --ink-soft: #8B899E;
    --neon: #FF2DAD;
    --neon-soft: rgba(255, 45, 173, 0.35);
    --cyan: #00E5FF;
    --danger: #FF4D4D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  body::before {
    content: ''; position: fixed; top: -20%; left: -10%; width: 60%; height: 60%;
    background: radial-gradient(circle, var(--neon-soft) 0%, transparent 70%);
    filter: blur(40px); z-index: 0;
  }
  body::after {
    content: ''; position: fixed; bottom: -20%; right: -10%; width: 60%; height: 60%;
    background: radial-gradient(circle, rgba(0,229,255,0.2) 0%, transparent 70%);
    filter: blur(40px); z-index: 0;
  }
  .card {
    position: relative; z-index: 1;
    max-width: 380px; width: 100%;
    border-radius: 24px; padding: 32px 24px;
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .step { display: none; }
  .step.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .eyebrow { text-align: center; font-size: 11px; color: var(--ink-soft); letter-spacing: 0.08em; margin-bottom: 8px; text-transform: uppercase; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; text-align: center; margin-bottom: 8px; line-height: 1.35; }
  .sub { text-align: center; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 22px; line-height: 1.5; }
  .privacy-note { text-align: center; font-size: 11px; color: var(--cyan); margin-bottom: 20px; }

  label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 8px; font-weight: 500; }
  input[type=text] {
    width: 100%; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px;
    letter-spacing: 0.35em; text-align: center; padding: 16px; border-radius: 14px;
    border: 1.5px solid rgba(255,255,255,0.1); background: var(--surface-2); color: var(--ink);
    margin-bottom: 18px; text-transform: uppercase;
  }
  input[type=text]:focus { outline: none; border-color: var(--neon); box-shadow: 0 0 0 4px var(--neon-soft); }
  .pseudo-input {
    font-family: 'Inter', sans-serif !important; font-weight: 500; font-size: 16px !important;
    letter-spacing: normal !important; text-align: left !important; text-transform: none !important;
  }
  .track-input { font-size: 16px !important; letter-spacing: normal !important; text-align: left !important; text-transform: none !important; font-family: 'Inter', sans-serif !important; }

  button.primary {
    width: 100%; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px;
    padding: 16px; border-radius: 14px; background: linear-gradient(90deg, var(--neon), #B14EFF);
    color: white; border: none; cursor: pointer; box-shadow: 0 8px 24px var(--neon-soft);
    transition: transform 0.15s ease; margin-top: 4px;
  }
  button.primary:hover { transform: translateY(-1px); }
  button.primary:disabled { background: var(--surface-2); box-shadow: none; color: var(--ink-soft); cursor: not-allowed; }

  .error { color: var(--neon); font-size: 12px; margin-top: -12px; margin-bottom: 14px; display: none; }

  .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 22px; }
